<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Liquid Chrome / Silver Gradient -->
    <linearGradient id="chromeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="25%" stop-color="#CBD5E1" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="75%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Holographic / Iridescent Glow -->
    <linearGradient id="holographicGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="33%" stop-color="#F472B6" />
      <stop offset="66%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <filter id="chromeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Centered Iconic Group -->
  <g transform="translate(60, 25)">
    <!-- Bag Body (Chrome Finish) -->
    <path d="M10 40 Q50 35 90 40 L105 130 Q105 145 90 145 L10 145 Q-5 145 -5 130 Z" fill="url(#chromeGradient)" />
    
    <!-- Iridescent Liquid Flow (Trendy Element) -->
    <path d="M-5 85 Q50 75 90 35" stroke="url(#holographicGlow)" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#chromeGlow)"/>
    <path d="M45 145 Q65 105 105 105" stroke="url(#holographicGlow)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Handle (Sleek Black) -->
    <path d="M30 40 Q50 15 70 40" stroke="#1E293B" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Adjusted Typography for Optical Alignment -->
  <text x="180" y="138" font-family="Outfit, Inter, sans-serif" font-size="96" font-weight="900" letter-spacing="-0.08em" fill="#0F172A">
    Trend<tspan fill="url(#holographicGlow)">ora</tspan>
  </text>
  

</svg>
